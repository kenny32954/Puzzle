<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imaging Output</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111214;color:#8b9092;font:12px monospace}.top{height:48px;border-bottom:1px solid #25282b;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#151719}.stage{height:calc(100% - 48px);display:grid;place-items:center;padding:24px}.frame{width:min(1080px,95vw);height:min(650px,82vh);border:1px solid #24272a;background:#0d0e10;box-shadow:0 20px 70px #0008;position:relative;overflow:hidden}.frame:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,#ffffff05 3px 4px);pointer-events:none}canvas{width:100%;height:100%;display:block}.status{opacity:.45}</style></head><body><header class="top"><span>FRAME PROCESSOR 2.6</span><span class="status">OUTPUT 0041</span></header><main class="stage"><div class="frame"><canvas id="c" width="1080" height="650"></canvas></div></main><script>

</script></body></html>
