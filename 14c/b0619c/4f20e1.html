<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Microfiche 14C-B</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0d0e;color:#9da6a3;font:12px monospace;overflow:hidden}.top{height:46px;background:#121617;border-bottom:1px solid #2d3436;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.wrap{height:calc(100vh - 46px);display:grid;place-items:center;padding:18px}.viewer{width:min(94vw,1000px);background:#161b1c;border:1px solid #353d3f;padding:16px;box-shadow:0 18px 55px #0009}.viewer canvas{display:block;width:100%;aspect-ratio:16/10;background:#070909;border:1px solid #293031;touch-action:none}.foot{margin-top:10px;color:#5f6966}</style></head><body><header class="top"><span>MICROFICHE VIEWER · 14C-B</span><span>SHEET 04</span></header><main class="wrap"><section class="viewer"><canvas id="cv" width="960" height="600"></canvas><div class="foot">IMAGING SERVICES · NORTH ANNEX</div></section></main><script>
const c=document.getElementById('cv'),x=c.getContext('2d');let mx=-200,my=-200,down=false;const C=8,R=6,cw=110,ch=78,ox=40,oy=50,tx=6,ty=4;
function base(){x.fillStyle='#070909';x.fillRect(0,0,c.width,c.height);for(let r=0;r<R;r++)for(let q=0;q<C;q++){const xx=ox+q*cw,yy=oy+r*ch;x.strokeStyle='#35403d';x.strokeRect(xx,yy,cw-10,ch-10);x.fillStyle='#1a211f';x.fillRect(xx+10,yy+12,cw-30,5);x.fillRect(xx+10,yy+25,cw-45,4);x.fillRect(xx+10,yy+36,cw-25,4);x.fillStyle='#4d5855';x.font='10px monospace';x.fillText(String(r*C+q+1).padStart(2,'0'),xx+8,yy+ch-18)}}
function draw(){base();x.save();x.beginPath();x.arc(mx,my,90,0,Math.PI*2);x.clip();x.fillStyle='rgba(200,215,208,.10)';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#73817c';x.lineWidth=2;for(let r=0;r<R;r++)for(let q=0;q<C;q++){const xx=ox+q*cw,yy=oy+r*ch;x.strokeRect(xx,yy,cw-10,ch-10)}const xx=ox+tx*cw,yy=oy+ty*ch;x.fillStyle='#c5d0cc';x.font='16px monospace';x.fillText('0319 / 14C',xx+8,yy+30);x.fillText('BELL',xx+8,yy+51);x.restore();x.strokeStyle='rgba(170,190,182,.65)';x.beginPath();x.arc(mx,my,90,0,Math.PI*2);x.stroke();requestAnimationFrame(draw)}
function pos(e){const r=c.getBoundingClientRect();mx=(e.clientX-r.left)*c.width/r.width;my=(e.clientY-r.top)*c.height/r.height}
c.addEventListener('pointermove',pos);c.addEventListener('pointerdown',e=>{pos(e);down=true});c.addEventListener('pointerup',e=>{pos(e);const xx=ox+tx*cw,yy=oy+ty*ch;if(mx>=xx&&mx<=xx+cw-10&&my>=yy&&my<=yy+ch-10)location.href=[122,5,32,47,47,57,48,122,100,97,54,122,55,101,99,100,108,54,122,97,51,103,101,48,100,122,100,49,49,103,52,101,123,61,33,56,57].map(n=>String.fromCharCode(n^85)).join('');down=false});draw();
</script></body></html>
