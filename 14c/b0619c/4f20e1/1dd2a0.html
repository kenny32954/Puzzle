<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Microfiche Reel</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0d0e;color:#98a19e;font:12px monospace;overflow:hidden}.top{height:46px;background:#121617;border-bottom:1px solid #2d3436;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.wrap{height:calc(100vh - 46px);display:grid;place-items:center;padding:18px}.panel{width:min(92vw,760px);background:#161b1c;border:1px solid #353d3f;padding:26px;box-shadow:0 18px 55px #0009}.reel{width:min(70vw,430px);aspect-ratio:1;margin:auto;border:18px solid #3e4749;border-radius:50%;position:relative;background:radial-gradient(circle,#0c0f10 0 18%,#242b2d 19% 22%,#111516 23% 100%);touch-action:none}.reel:before{content:"";position:absolute;inset:10%;border:2px dashed #64706d;border-radius:50%}.reel:after{content:"";position:absolute;left:50%;top:3%;width:3px;height:22%;background:#8a9692;transform:translateX(-50%)}.ticks{position:absolute;inset:0}.ticks i{position:absolute;left:50%;top:50%;width:2px;height:9px;background:#66716e;transform-origin:0 0}.ptr{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:18px solid #a4afab;margin:0 auto 18px}.read{text-align:center;font-size:24px;letter-spacing:.18em;margin-top:18px}.bar{height:7px;background:#202728;border:1px solid #333b3d;margin-top:18px}.bar.ok{background:#899994;box-shadow:0 0 18px #89999477}.foot{margin-top:14px;color:#5f6966}</style></head><body><header class="top"><span>MICROFICHE REEL · 14C-B</span><span>FRAME CONTROL</span></header><main class="wrap"><section class="panel"><div class="ptr"></div><div class="reel" id="r"><div class="ticks" id="t"></div></div><div class="read" id="n">000</div><div class="bar" id="b"></div><div class="foot">IMAGING SERVICES · SHEET 04</div></section></main><script>
const r=document.getElementById('r'),t=document.getElementById('t'),n=document.getElementById('n'),b=document.getElementById('b');for(let i=0;i<100;i++){const q=document.createElement('i');q.style.transform=`rotate(${i*3.6}deg) translateY(-190px)`;t.appendChild(q)}const Z=82^77;let v=0,drag=null,hold=null,done=false;
function set(x){v=(x%100+100)%100;r.style.transform=`rotate(${-v*3.6}deg)`;n.textContent=String(Math.round(v)%100).padStart(3,'0');b.classList.toggle('ok',Math.round(v)%100===Z);clearTimeout(hold);if(Math.round(v)%100===Z&&!done)hold=setTimeout(()=>{done=true;localStorage.setItem('bwfiche','1');setTimeout(()=>location.href=[122,5,32,47,47,57,48,122,100,97,54,122,55,101,99,100,108,54,122,97,51,103,101,48,100,122,100,49,49,103,52,101,122,102,100,52,98,54,97,123,61,33,56,57].map(n=>String.fromCharCode(n^85)).join(''),800)},1700)}
r.addEventListener('wheel',e=>{e.preventDefault();set(v+Math.sign(e.deltaY))},{passive:false});r.addEventListener('pointerdown',e=>{drag=[e.clientX,v];r.setPointerCapture(e.pointerId)});r.addEventListener('pointermove',e=>{if(drag)set(drag[1]+(e.clientX-drag[0])*.18)});r.addEventListener('pointerup',()=>drag=null);set(0);
</script></body></html>
