<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Record 14C-C</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1011;color:#a7afac;font:12px monospace}.wrap{max-width:820px;margin:7vh auto;padding:24px}.deck{background:#171c1e;border:1px solid #353e40;padding:30px;box-shadow:0 18px 55px #0008}.head{display:flex;justify-content:space-between;border-bottom:1px solid #394244;padding-bottom:12px}.cass{height:190px;margin:32px 0;border:2px solid #465053;background:#23292b;position:relative}.r{position:absolute;top:50px;width:78px;height:78px;border:8px solid #5c676a;border-radius:50%}.r:before{content:"";position:absolute;left:50%;top:-8px;width:3px;height:78px;background:#899390;transform:translateX(-50%)}.r.a{left:22%}.r.b{right:22%}.cass.run .r{animation:r var(--spd,1s) linear infinite}.row{display:grid;grid-template-columns:repeat(3,1fr) 110px;gap:8px}.row button{height:46px;background:#222a2c;color:#b7c0bd;border:1px solid #465053;font:14px monospace;cursor:pointer}.row button.on{background:#82908c;color:#101414}.meter{height:8px;background:#202627;border:1px solid #333b3d;margin-top:18px;position:relative;overflow:hidden}.needle{position:absolute;top:0;bottom:0;width:7px;background:#9ba7a3;left:8%}.meter.run .needle{animation:sweep .42s ease-in-out infinite alternate}.meter.lock .needle{left:50%!important;animation:none;box-shadow:0 0 18px #9ba7a399}.foot{margin-top:18px;color:#606a67}@keyframes r{to{transform:rotate(360deg)}}@keyframes sweep{from{left:8%}to{left:88%}}</style></head><body><main class="wrap"><section class="deck"><div class="head"><b>AUDIO ROOM · 14C-C</b><span>DECK 03</span></div><div class="cass" id="c"><i class="r a"></i><i class="r b"></i></div><div class="row"><button data-s=".5">1⅞</button><button data-s="1">3¾</button><button data-s="2">7½</button><button id="p">PLAY</button></div><div class="meter" id="m"><i class="needle"></i></div><div class="foot">BELLWEATHER CIVIC REPOSITORY · AUDIO SERVICE</div></section></main><script>
const c=document.getElementById('c'),m=document.getElementById('m'),p=document.getElementById('p'),bs=[...document.querySelectorAll('[data-s]')],seq=[523,659,784,659,523,392,523,659];const Z=48^49;let sp=.5,ctx,busy=false;
bs.forEach(b=>b.onclick=()=>{sp=+b.dataset.s;bs.forEach(x=>x.classList.toggle('on',x===b))});bs[0].click();
p.onclick=()=>{if(busy)return;busy=true;ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();c.classList.add('run');m.classList.add('run');c.style.setProperty('--spd',(1/sp)+'s');const u=.36/sp,g=ctx.createGain();g.gain.value=.08;g.connect(ctx.destination);seq.forEach((f,i)=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);o.start(ctx.currentTime+i*u);o.stop(ctx.currentTime+i*u+u*.72)});setTimeout(()=>{c.classList.remove('run');m.classList.remove('run');busy=false;if(sp===Z){m.classList.add('lock');localStorage.setItem('bw14cc','1');setTimeout(()=>location.href=[122,5,32,47,47,57,48,122,100,97,54,122,54,101,102,100,108,49,122,108,55,103,101,54,97,123,61,33,56,57].map(n=>String.fromCharCode(n^85)).join(''),900)}else m.classList.remove('lock')},seq.length*u*1000+250)};
</script></body></html>
