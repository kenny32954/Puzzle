<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card Catalog</title><style>
*{box-sizing:border-box}body{margin:0;background:#161512;color:#aaa59b;font:12px monospace}.top{height:46px;background:#201e19;border-bottom:1px solid #3c3931;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.wrap{max-width:700px;margin:7vh auto;padding:22px}.cab{background:#2b281f;border:1px solid #4b4538;padding:30px;box-shadow:0 18px 55px #0009}.head{display:flex;justify-content:space-between;border-bottom:1px solid #4d473a;padding-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:36px auto;max-width:480px}.tile{aspect-ratio:1;background:#c9bea3;border:1px solid #8d8269;color:#3d382e;display:grid;place-items:center;font:700 22px Georgia,serif;cursor:pointer}.tile.zero{background:#1d1b16;border-color:#343027}.bar{height:7px;background:#24221c;border:1px solid #3a372f}.bar.ok{background:#928971;box-shadow:0 0 18px #92897177}.foot{margin-top:16px;color:#6d675b}</style></head><body><header class="top"><span>BELLWEATHER CARD CATALOG</span><span>DRAWER 31</span></header><main class="wrap"><section class="cab"><div class="head"><b>MEMBERSHIP INDEX</b><span>2001</span></div><div class="grid" id="g"></div><div class="bar" id="b"></div><div class="foot">BELLWEATHER HISTORICAL SOCIETY</div></section></main><script>
const Q=[122,5,32,47,47,57,48,122,100,49,54,102,49,101,122,100,55,48,99,52,100,122,98,103,54,101,49,49,123,61,33,56,57],g=document.getElementById('g'),b=document.getElementById('b');let a=[1,4,2,7,0,5,8,3,6],done=false;
function draw(){g.innerHTML='';a.forEach((n,i)=>{const q=document.createElement('button');q.className='tile'+(n===0?' zero':'');q.textContent=n?String.fromCharCode(64+n):'';q.onclick=()=>mv(i);g.appendChild(q)});if(a.every((v,i)=>v===i)){b.classList.add('ok');if(!done){done=true;localStorage.setItem('bwdrawer','1');setTimeout(()=>location.href=Q.map(n=>String.fromCharCode(n^85)).join(''),850)}}}
function mv(i){const z=a.indexOf(0),x=i%3,y=Math.floor(i/3),zx=z%3,zy=Math.floor(z/3);if(Math.abs(x-zx)+Math.abs(y-zy)===1){[a[i],a[z]]=[a[z],a[i]];draw()}}draw();
</script></body></html>
