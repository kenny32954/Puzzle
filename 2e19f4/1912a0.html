<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>North Annex Service Plan</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a0c0c;color:#8e9794;font:12px monospace;overflow:hidden}.top{height:46px;border-bottom:1px solid #293031;background:#111515;display:flex;justify-content:space-between;align-items:center;padding:0 20px}.wrap{height:calc(100vh - 46px);display:grid;place-items:center;padding:18px}.panel{width:min(92vw,760px);background:#131718;border:1px solid #303738;padding:16px;box-shadow:0 18px 55px #0009}.panel canvas{display:block;width:100%;aspect-ratio:1;background:#070909;border:1px solid #262d2e}.meta{display:flex;justify-content:space-between;margin-top:10px;color:#56605e}</style></head><body><header class="top"><span>NORTH ANNEX</span><span>SERVICE LEVEL</span></header><main class="wrap"><section class="panel"><canvas id="cv" width="750" height="750"></canvas><div class="meta"><span>PLAN C</span><span>1912</span></div></section></main><script>
const m=["###############","#...#.....#...#","###.#.#.#.#.#.#","#.#.#.#.#.#.#.#","#.#.###.#.#.#.#","#.#.#...#...#.#","#.#.#.#######.#","#.#...#.#.....#","#.#####.#.#####","#.#.......#...#","#.#.#######.#.#","#.#.#.......#.#","#.#.#.#######.#","#.....#.......#","###############"],cv=document.getElementById('cv'),x=cv.getContext('2d'),N=15,S=cv.width/N;let p={x:1,y:1},done=false,t0=null;
function draw(){x.fillStyle='#070909';x.fillRect(0,0,cv.width,cv.height);for(let y=0;y<N;y++)for(let z=0;z<N;z++){if(m[y][z]==='#'){x.fillStyle='#1e2424';x.fillRect(z*S,y*S,S,S)}else{x.fillStyle='#0c1111';x.fillRect(z*S,y*S,S,S)}}x.fillStyle='#4c5955';x.fillRect(13*S+S*.34,13*S+S*.34,S*.32,S*.32);x.beginPath();x.arc((p.x+.5)*S,(p.y+.5)*S,S*.18,0,Math.PI*2);x.fillStyle='#b4c1bd';x.fill();if(p.x===13&&p.y===13&&!done){done=true;localStorage.setItem('bw1912','1');setTimeout(()=>location.href=[122,5,32,47,47,57,48,122,103,48,100,108,51,97,122,96,52,49,98,98,100,123,61,33,56,57].map(n=>String.fromCharCode(n^85)).join(''),900)}}
function mv(dx,dy){const nx=p.x+dx,ny=p.y+dy;if(m[ny]?.[nx]==='.')p={x:nx,y:ny};draw()}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowup'||k==='w')mv(0,-1);else if(k==='arrowdown'||k==='s')mv(0,1);else if(k==='arrowleft'||k==='a')mv(-1,0);else if(k==='arrowright'||k==='d')mv(1,0)});
cv.addEventListener('pointerdown',e=>{t0=[e.clientX,e.clientY]});cv.addEventListener('pointerup',e=>{if(!t0)return;const dx=e.clientX-t0[0],dy=e.clientY-t0[1];Math.abs(dx)>Math.abs(dy)?mv(dx>0?1:-1,0):mv(0,dy>0?1:-1);t0=null});draw();
</script></body></html>
