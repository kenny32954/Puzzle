<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service Room</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0d0d;color:#909895;font:12px monospace;overflow:hidden}.top{height:46px;background:#111515;border-bottom:1px solid #293030;display:flex;justify-content:space-between;align-items:center;padding:0 20px}.room{height:calc(100vh - 46px);position:relative;background:linear-gradient(#121515,#080909)}.desk{position:absolute;left:50%;bottom:12%;width:min(70vw,620px);height:190px;transform:translateX(-50%);background:#28231e;border:1px solid #413a33;box-shadow:0 25px 50px #0008}.paper{position:absolute;left:18%;top:18%;width:44%;height:54%;background:#c8c0ad;transform:rotate(-2deg);opacity:.82;transition:transform .3s}.bell{position:absolute;right:17%;top:20%;width:90px;height:84px;background:transparent;border:0;cursor:default}.bell:before{content:"";position:absolute;left:16px;right:16px;top:16px;height:48px;border-radius:55% 55% 18% 18%;background:#8c754b;border:2px solid #b49a64;box-shadow:inset 0 -10px 18px #4f4028}.bell:after{content:"";position:absolute;left:27px;right:27px;bottom:7px;height:9px;background:#7d6843;border:2px solid #b49a64}.bell.hit{animation:ring .18s 6 alternate}.lamp{position:absolute;left:50%;top:10%;width:10px;height:10px;border-radius:50%;background:#2c3331}.lamp.on{background:#a9b5b1;box-shadow:0 0 25px #a9b5b199}.clock{position:absolute;right:20px;top:18px;color:#69736f}.shadow{position:absolute;left:8%;top:8%;height:78%;width:18px;background:#020303;opacity:0}.room.live .shadow{animation:pass 2.4s ease-in-out forwards}@keyframes ring{to{transform:rotate(3deg)}}@keyframes pass{0%{opacity:0;left:8%}35%{opacity:.32}75%{opacity:.15}100%{opacity:0;left:86%}}</style></head><body><header class="top"><span>NORTH ANNEX · SERVICE ROOM</span><span>03:19</span></header><main class="room" id="r"><div class="shadow"></div><span class="clock">17 MAR 1994</span><div class="desk"><div class="paper" id="p"></div><button class="bell" id="b"></button></div><i class="lamp" id="l"></i></main><script>
const b=document.getElementById('b'),p=document.getElementById('p'),l=document.getElementById('l'),r=document.getElementById('r');let n=0,ctx;
function tone(){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(880,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(430,ctx.currentTime+.55);g.gain.setValueAtTime(.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.65);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.7)}
b.onclick=()=>{tone();n++;b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');p.style.transform=`rotate(${-2+(n%5)*.55}deg) translateX(${Math.min(n,8)*1.5}px)`;l.classList.toggle('on',n%2===0);if(n===3){r.classList.add('live');setTimeout(()=>r.classList.remove('live'),2600)}if(n===6)location.href=[122,5,32,47,47,57,48,122,108,100,55,49,102,101,122,51,101,54,102,109,100,123,33,45,33].map(n=>String.fromCharCode(n^85)).join('')};
</script></body></html>
