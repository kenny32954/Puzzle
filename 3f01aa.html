<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relay Board</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0e0f;color:#9ba4a1;font:12px monospace}.wrap{max-width:720px;margin:9vh auto;padding:24px}.panel{background:#151a1b;border:1px solid #343c3e;padding:34px;box-shadow:0 18px 55px #0008}.head{display:flex;justify-content:space-between;border-bottom:1px solid #384143;padding-bottom:12px}.bank{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:48px 0}.k{aspect-ratio:1;border:1px solid #495255;background:#202729;color:#64706d;font:700 22px monospace;cursor:pointer;box-shadow:inset 0 0 0 5px #14191a}.k.on{background:#a3b0ac;color:#151919;box-shadow:0 0 28px #a3b0ac66,inset 0 0 0 5px #d4d9d7}.bar{height:7px;background:#1d2324;border:1px solid #303738}.bar.ok{background:#879a94;box-shadow:0 0 18px #879a9477}.foot{margin-top:20px;color:#5e6966}</style></head><body><main class="wrap"><section class="panel"><div class="head"><b>BELLWEATHER RELAY TEST</b><span>14-C</span></div><div class="bank"><button class="k" data-n="0">A</button><button class="k" data-n="1">B</button><button class="k" data-n="2">C</button><button class="k" data-n="3">D</button></div><div class="bar" id="bar"></div><div class="foot">RACK 03 · SERVICE BENCH</div></section></main><script>
const s=Array.from({length:10},(_,i)=>(0x8d72c>>(18-i*2))&3),ks=[...document.querySelectorAll('.k')],bar=document.getElementById('bar');let p=0,live=false;
function pulse(i,d=300){ks[i].classList.add('on');setTimeout(()=>ks[i].classList.remove('on'),d)}
function show(){live=false;p=0;s.forEach((n,i)=>setTimeout(()=>pulse(n,260),500+i*430));setTimeout(()=>live=true,500+s.length*430+180)}
ks.forEach(k=>k.onclick=()=>{const n=+k.dataset.n;pulse(n,120);if(!live)return;if(n===s[p]){p++;if(p===s.length){live=false;bar.classList.add('ok');localStorage.setItem('bwrelay','1');setTimeout(()=>location.href='/Puzzle/3f01aa/77c1e4.html',1200)}}else{bar.classList.remove('ok');show()}});
setTimeout(show,900);
</script></body></html>
