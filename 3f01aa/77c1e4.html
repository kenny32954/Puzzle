<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relay Event</title><style>
*{box-sizing:border-box}body{margin:0;background:#090c0d;color:#96a09d;font:12px monospace}.wrap{max-width:820px;margin:10vh auto;padding:24px}.rack{background:#14191a;border:1px solid #30383a;padding:36px;box-shadow:0 18px 55px #0009}.head{display:flex;justify-content:space-between;border-bottom:1px solid #353e40;padding-bottom:12px}.lamps{display:grid;grid-template-columns:repeat(8,1fr);gap:18px;margin:55px 0}.l{aspect-ratio:1;border-radius:50%;border:1px solid #414a4b;background:#1d2324;box-shadow:inset 0 0 18px #000}.l.on{background:#a6b3af;box-shadow:0 0 24px #a6b3af88,inset 0 0 8px #fff6}.tick{height:4px;background:#202627;border:1px solid #303839}.foot{margin-top:20px;color:#5f6a67}</style></head><body><main class="wrap"><section class="rack"><div class="head"><b>RELAY EVENT CAPTURE</b><span>RACK 03</span></div><div class="lamps"><i class="l" data-i="0"></i><i class="l" data-i="1"></i><i class="l" data-i="2"></i><i class="l" data-i="3"></i><i class="l" data-i="4"></i><i class="l" data-i="5"></i><i class="l" data-i="6"></i><i class="l" data-i="7"></i></div><div class="tick" id="tick"></div><div class="foot">EVENT 0619-C</div></section></main><script>
const f=["00101111","01010000","01110101","01111010","01111010","01101100","01100101","00101111","00111001","00110001","01100010","01100100","00110011","00110000","00101111","00111001","00110001","01100100","00110110","00110000","00110011","00101110","01110100","01111000","01110100"],ls=[...document.querySelectorAll('.l')],tick=document.getElementById('tick');let i=0;
function step(){const b=f[i];ls.forEach((l,n)=>l.classList.toggle('on',b[n]==='1'));tick.style.width=((i+1)/f.length*100)+'%';i=(i+1)%f.length}step();setInterval(step,720);
</script></body></html>
