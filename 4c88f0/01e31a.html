<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Index</title><style>
*{box-sizing:border-box}body{margin:0;background:#151514;color:#a8a69e;font:12px monospace}.top{height:46px;background:#20201e;border-bottom:1px solid #3c3c38;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.wrap{max-width:900px;margin:5vh auto;padding:22px}.tray{background:#22221f;border:1px solid #45453f;padding:28px;box-shadow:0 16px 50px #0008}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.c{aspect-ratio:4/3;border:1px solid #4b4b45;background:#0d0e0d;color:#0d0e0d;font:34px monospace;display:grid;place-items:center;cursor:pointer;transition:.18s;box-shadow:inset 0 0 0 8px #171817}.c.on,.c.hit{background:#d1cec4;color:#302f2b;box-shadow:inset 0 0 0 8px #b8b5aa}.c.hit{opacity:.5}.bar{height:6px;background:#252723;border:1px solid #3c3e39;margin-top:20px}.bar.ok{background:#8f9a91;box-shadow:0 0 18px #8f9a9188}.foot{margin-top:14px;color:#666961}@media(max-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><header class="top"><span>BELLWEATHER PHOTO ACCESSIONS</span><span>BOX 14</span></header><main class="wrap"><section class="tray"><div class="grid" id="g"></div><div class="bar" id="b"></div><div class="foot">LOCAL HISTORY · UNCATALOGED PRINTS</div></section></main><script>
const v=['◉','⌑','≡','◷','◎','▥'],g=document.getElementById('g'),bar=document.getElementById('b');let a=[...v,...v].sort(()=>Math.random()-.5),open=[],lock=false,done=0;
a.forEach((s,i)=>{const c=document.createElement('button');c.className='c';c.dataset.i=i;c.dataset.v=s;c.textContent=s;c.onclick=()=>flip(c);g.appendChild(c)});
function flip(c){if(lock||c.classList.contains('hit')||c.classList.contains('on'))return;c.classList.add('on');open.push(c);if(open.length===2){lock=true;setTimeout(()=>{if(open[0].dataset.v===open[1].dataset.v){open.forEach(x=>{x.classList.remove('on');x.classList.add('hit')});done+=2;if(done===a.length){bar.classList.add('ok');localStorage.setItem('bwphotos','1');setTimeout(()=>location.href=[122,5,32,47,47,57,48,122,97,54,109,109,51,101,122,98,52,103,100,54,101,123,61,33,56,57].map(n=>String.fromCharCode(n^85)).join(''),900)}}else open.forEach(x=>x.classList.remove('on'));open=[];lock=false},650)}}
</script></body></html>
