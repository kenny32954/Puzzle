<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donor Envelope</title><style>
*{box-sizing:border-box}body{margin:0;background:#181714;color:#a9a49a;font:13px Georgia,serif}.wrap{height:100vh;display:grid;place-items:center;padding:24px}.env{position:relative;width:min(88vw,700px);height:430px;background:#bdb39d;border:1px solid #8f866f;box-shadow:0 18px 50px #0008;perspective:1200px}.env:before,.env:after{content:"";position:absolute;inset:0;pointer-events:none}.env:before{clip-path:polygon(0 0,50% 56%,100% 0);background:#c8bea8;transform-origin:top;transition:transform .9s}.env.open:before{transform:rotateX(165deg)}.env:after{clip-path:polygon(0 100%,0 0,50% 56%,100% 0,100% 100%);background:#b4aa93}.card{position:absolute;left:9%;right:9%;top:16%;height:72%;background:#ece5d5;border:1px solid #a49a83;padding:34px;z-index:0;transform:translateY(90px);transition:transform 1s .35s;overflow:hidden}.env.open .card{transform:translateY(-34px);z-index:3}.flap{position:absolute;left:0;right:0;top:0;height:55%;border:0;background:transparent;z-index:5;cursor:default}.stamp{font:11px monospace;color:#736a58;border-bottom:1px solid #b4aa95;padding-bottom:10px;margin-bottom:22px}.lines{font:16px/1.9 "Courier New",monospace;color:#474238}.holes{display:flex;gap:13px;margin-top:20px}.holes i{width:14px;height:14px;border-radius:50%;border:1px solid #756e5e}.holes i.on{background:#514c42}.sig{margin-top:24px;font-style:italic;color:#6a6254}</style></head><body><main class="wrap"><section class="env" id="e"><button class="flap" id="f"></button><article class="card"><div class="stamp">BELLWEATHER HISTORICAL SOCIETY · DONATION 22-B</div><div class="lines">The photographs were found inside a cedar box after the house was cleared.<br><br>Three prints show the annex gallery. One print shows the gallery empty. One shows a chair. One shows two.</div><div class="holes" id="h"></div><div class="sig">M. Vale</div></article></section></main><script>
const e=document.getElementById('e'),f=document.getElementById('f'),h=document.getElementById('h'),bits='0101100101001100010101100010010101001101010001000011110100111101';[...bits].forEach(b=>{const i=document.createElement('i');if(b==='1')i.className='on';h.appendChild(i)});f.onclick=()=>e.classList.toggle('open');
</script></body></html>
