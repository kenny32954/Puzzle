<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Closed Stacks</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0c0b;color:#858b87;font:12px monospace;overflow:hidden}.top{height:46px;background:#111312;border-bottom:1px solid #282d2a;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.room{height:calc(100vh - 46px);display:grid;place-items:center;padding:20px;background:linear-gradient(#101210,#070807)}.shelf{width:min(94vw,980px);height:min(78vh,650px);display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr);gap:10px;background:#171a17;border:6px solid #2c302c;padding:16px;box-shadow:0 22px 60px #0009}.bx{position:relative;background:#514b3f;border:1px solid #6a6253;color:#aaa18d;font:11px monospace;cursor:default;transition:transform .8s,box-shadow .8s;overflow:hidden}.bx:before{content:"";position:absolute;left:8%;right:8%;top:10%;height:18%;border:1px solid #716858;background:#625a4b}.bx span{position:absolute;left:12%;bottom:12%;opacity:.72}.bx.q.live{transform:translateY(22px) scale(1.04);box-shadow:0 18px 30px #000a;z-index:3}.bx.q.live:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#b4aa9150,transparent);animation:s 1.6s linear infinite}.flash{position:fixed;inset:0;background:#e3e1d7;opacity:0;pointer-events:none}.flash.on{animation:f .12s 4 alternate}@keyframes s{from{transform:translateX(-100%)}to{transform:translateX(100%)}}@keyframes f{to{opacity:.45}}@media(max-width:700px){.shelf{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr)}}</style></head><body><header class="top"><span>BELLWEATHER CIVIC REPOSITORY</span><span>CLOSED STACKS</span></header><main class="room"><section class="shelf"><button class="bx " data-i="0"><span>14-C</span></button><button class="bx " data-i="1"><span>NA-0619</span></button><button class="bx " data-i="2"><span>M-0319</span></button><button class="bx " data-i="3"><span>BX-1912</span></button><button class="bx " data-i="4"><span>SER-D</span></button><button class="bx " data-i="5"><span>R-31</span></button><button class="bx " data-i="6"><span>14-C</span></button><button class="bx " data-i="7"><span>NA-0619</span></button><button class="bx " data-i="8"><span>M-0319</span></button><button class="bx " data-i="9"><span>BX-1912</span></button><button class="bx " data-i="10"><span>SER-D</span></button><button class="bx " data-i="11"><span>R-31</span></button><button class="bx " data-i="12"><span>14-C</span></button><button class="bx " data-i="13"><span>NA-0619</span></button><button class="bx " data-i="14"><span>M-0319</span></button><button class="bx " data-i="15"><span>BX-1912</span></button><button class="bx " data-i="16"><span>SER-D</span></button><button class="bx q" data-i="17"><span>R-31</span></button><button class="bx " data-i="18"><span>14-C</span></button><button class="bx " data-i="19"><span>NA-0619</span></button><button class="bx " data-i="20"><span>M-0319</span></button><button class="bx " data-i="21"><span>BX-1912</span></button><button class="bx " data-i="22"><span>SER-D</span></button><button class="bx " data-i="23"><span>R-31</span></button></section></main><div class="flash" id="fl"></div><script>
const q=document.querySelector('.bx.q'),fl=document.getElementById('fl');function live(){q.classList.add('live');setTimeout(()=>q.classList.remove('live'),2600)}setTimeout(live,14400);setInterval(live,23700);q.onclick=()=>{if(!q.classList.contains('live'))return;fl.classList.add('on');setTimeout(()=>location.href=[122,5,32,47,47,57,48,122,96,52,109,54,102,100,122,101,49,103,108,51,48,122,54,54,100,97,55,103,122,98,48,101,102,52,108,122,97,51,102,52,100,101,123,61,33,56,57].map(n=>String.fromCharCode(n^85)).join(''),520)};
</script></body></html>
