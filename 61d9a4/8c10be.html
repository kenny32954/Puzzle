<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera Archive</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b0b;color:#aab2af;font:12px "Courier New",monospace}.top{height:46px;background:#121616;border-bottom:1px solid #2b3131;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.wrap{max-width:1100px;margin:4vh auto;padding:18px}.monitor{background:#111414;border:1px solid #313737;padding:14px;box-shadow:0 18px 55px #0009}.feed{position:relative;aspect-ratio:16/9;background:#171918;overflow:hidden;border:1px solid #2a2f2e}.feed:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 3px 4px);opacity:.025;pointer-events:none}.room{position:absolute;inset:0}.wall{position:absolute;left:12%;right:12%;top:14%;bottom:14%;border:2px solid #5a5d58}.door{position:absolute;left:15%;bottom:14%;width:14%;height:39%;border:2px solid #5a5d58;border-bottom:0}.window{position:absolute;right:17%;top:22%;width:22%;height:23%;border:2px solid #5a5d58}.chair{position:absolute;left:47%;top:58%;width:42px;height:40px;border:3px solid #8f918b;border-top:0;transform:translate(-50%,-50%);opacity:.86}.chair:before{content:"";position:absolute;left:4px;right:4px;top:-26px;height:22px;border:3px solid #8f918b}.chair:after{content:"";position:absolute;left:-4px;right:-4px;bottom:-26px;height:26px;border-left:3px solid #8f918b;border-right:3px solid #8f918b}.chair.b{left:59%;opacity:0}.ghost .chair.b{animation:appear 2.7s forwards}.ghost .feed{animation:jump .16s 5 alternate}.stamp{position:absolute;left:16px;top:14px;color:#8d9692}.time{position:absolute;right:16px;top:14px;color:#8d9692}.controls{padding:18px 3px 2px}.scrub{appearance:none;width:100%;height:5px;background:#2c3332}.scrub::-webkit-slider-thumb{appearance:none;width:8px;height:26px;background:#a5ada9;border:0}.marks{display:flex;justify-content:space-between;margin-top:9px;color:#59625f}.unlock{height:8px;background:#1d2221;border:1px solid #303635;margin-top:18px}.unlock.on{background:#879b94;box-shadow:0 0 18px #879b9488}@keyframes appear{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}45%{opacity:.85}100%{opacity:.85;transform:translate(-50%,-50%) scale(1)}}@keyframes jump{to{transform:translateX(2px)}} </style></head><body><header class="top"><span>NORTH ANNEX CAMERA ARCHIVE</span><span>CAM 02</span></header><main class="wrap"><section class="monitor"><div class="feed" id="feed"><div class="room"><div class="wall"></div><div class="door"></div><div class="window"></div><div class="chair"></div><div class="chair b"></div></div><span class="stamp">19 JUN 1987</span><span class="time" id="tm">08:20</span></div><div class="controls"><input id="scr" class="scrub" type="range" min="500" max="590" value="500"><div class="marks"><span>08:20</span><span>09:50</span></div><div class="unlock" id="ul"></div></div></section></main><script>
const scr=document.getElementById('scr'),tm=document.getElementById('tm'),feed=document.getElementById('feed'),ul=document.getElementById('ul');const Z=130^675;let hold=null,done=false;
function fmt(v){const m=500+(v-500),h=Math.floor(m/60),mm=m%60;return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0')}
function chk(){const v=+scr.value;tm.textContent=fmt(v);feed.classList.toggle('ghost',v===Z);ul.style.opacity=v===Z?1:.18;clearTimeout(hold);if(v===Z&&!done){hold=setTimeout(()=>{done=true;ul.classList.add('on');localStorage.setItem('bwcam','1');setTimeout(()=>location.href=[122,5,32,47,47,57,48,122,99,100,49,108,52,97,122,100,108,54,99,51,101,123,61,33,56,57].map(n=>String.fromCharCode(n^85)).join(''),1500)},2600)}}
scr.addEventListener('input',chk);chk();
</script></body></html>
