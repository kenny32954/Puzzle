<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Darkroom Tray</title><style>
*{box-sizing:border-box}body{margin:0;background:#120909;color:#ad9991;font:12px monospace}.top{height:46px;background:#220d0d;border-bottom:1px solid #472521;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.wrap{max-width:940px;margin:6vh auto;padding:22px}.bench{background:#1b1010;border:1px solid #472724;padding:24px;box-shadow:0 18px 55px #0009}.tray{position:relative;aspect-ratio:16/8;background:#080606;border:18px solid #30201e;overflow:hidden}.water{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#1e1514,#0b0707)}.drop{position:absolute;top:-18px;width:8px;height:12px;border-radius:50%;background:#b48e82;opacity:0}.drop.fall{animation:d .55s linear}.rip{position:absolute;bottom:16%;width:10px;height:5px;border:1px solid #9d776d;border-radius:50%;opacity:0;transform:translateX(-50%)}.rip.on{animation:r .8s ease-out}.ticks{display:grid;grid-template-columns:repeat(16,1fr);margin-top:14px;color:#5f4d48;text-align:center}.foot{margin-top:14px;color:#67524c}@keyframes d{0%{opacity:0;transform:translateY(0)}25%{opacity:.8}100%{opacity:.1;transform:translateY(320px)}}@keyframes r{0%{opacity:.8;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(12,4)}}</style></head><body><header class="top"><span>BELLWEATHER DARKROOM</span><span>TRAY 06</span></header><main class="wrap"><section class="bench"><div class="tray" id="tray"><div class="water"></div><i class="drop" id="drop"></i><i class="rip" id="rip"></i></div><div class="ticks"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span></div><div class="foot">NEGATIVE PROCESSING · 0619-B</div></section></main><script>
const a=[2,15,5,0,7,5,7,10,7,10,6,12,6,5,2,15,3,9,3,1,6,2,6,4,3,3,3,0,2,15,3,7,3,5,6,4,3,0,6,1,3,1,2,14,7,4,7,8,7,4],d=document.getElementById('drop'),r=document.getElementById('rip'),tray=document.getElementById('tray');let i=0;
function step(){const v=a[i],x=(v+.5)/16*100;d.style.left=x+'%';r.style.left=x+'%';d.classList.remove('fall');r.classList.remove('on');void d.offsetWidth;d.classList.add('fall');setTimeout(()=>{r.classList.add('on')},430);i=(i+1)%a.length}
setInterval(step,620);step();
</script></body></html>
