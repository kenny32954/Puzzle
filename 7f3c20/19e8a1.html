<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radio Club Cassette</title><style>
*{box-sizing:border-box}body{margin:0;background:#101214;color:#a8b0ae;font:12px monospace}.wrap{max-width:820px;margin:7vh auto;padding:24px}.deck{background:#1b2022;border:1px solid #3a4245;padding:28px;box-shadow:0 18px 55px #0008}.head{display:flex;justify-content:space-between;border-bottom:1px solid #3d4548;padding-bottom:12px}.cass{margin:34px auto;width:min(100%,560px);height:210px;border:2px solid #4a5356;background:#272d2f;position:relative}.reel{position:absolute;top:54px;width:82px;height:82px;border:8px solid #596266;border-radius:50%;box-shadow:inset 0 0 0 10px #1d2224}.reel:before{content:"";position:absolute;left:50%;top:-8px;width:4px;height:82px;background:#778185;transform:translateX(-50%)}.reel.a{left:90px}.reel.b{right:90px}.cass.run .reel{animation:r 1.1s linear infinite}.slot{position:absolute;left:120px;right:120px;bottom:22px;height:24px;background:#111516;border:1px solid #394145}.controls{display:grid;grid-template-columns:130px 1fr;gap:24px;align-items:start}.play{height:48px;background:#273033;color:#c0c7c5;border:1px solid #4b5558;font:700 13px monospace;cursor:pointer}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad button{height:50px;background:#22292b;color:#aab2af;border:1px solid #40494c;font:18px monospace;cursor:pointer}.pad button:active{background:#8f9b97;color:#111}.bar{height:6px;background:#202628;border:1px solid #333b3d;margin-top:18px}.bar.ok{background:#8b9994;box-shadow:0 0 18px #8b999477}.foot{margin-top:18px;color:#616b68}@keyframes r{to{transform:rotate(360deg)}}@media(max-width:650px){.controls{grid-template-columns:1fr}.play{width:100%}}</style></head><body><main class="wrap"><section class="deck"><div class="head"><b>BELLWEATHER HIGH · RADIO CLUB</b><span>CASSETTE 19</span></div><div class="cass" id="cass"><i class="reel a"></i><i class="reel b"></i><i class="slot"></i></div><div class="controls"><button class="play" id="play">PLAY</button><div><div class="pad" id="pad"><button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button><button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button><button data-n="0">0</button></div><div class="bar" id="bar"></div></div></div><div class="foot">STUDENT EQUIPMENT ROOM · 1998</div></section></main><script>
const seq=[28,20,28,31,29,27,28,20].map(n=>String.fromCharCode(n^45)).join(''),F={1:[697,1209],2:[697,1336],3:[697,1477],4:[770,1209],5:[770,1336],6:[770,1477],7:[852,1209],8:[852,1336],9:[852,1477],0:[941,1336]},play=document.getElementById('play'),cass=document.getElementById('cass'),bar=document.getElementById('bar');let ctx,buf='';
function tone(n,d=.25,t=0){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const when=ctx.currentTime+t,g=ctx.createGain();g.gain.setValueAtTime(.10,when);g.gain.exponentialRampToValueAtTime(.001,when+d);g.connect(ctx.destination);F[n].forEach(fr=>{const o=ctx.createOscillator();o.frequency.value=fr;o.connect(g);o.start(when);o.stop(when+d)})}
play.onclick=()=>{cass.classList.add('run');[...seq].forEach((n,i)=>tone(n,.28,i*.48));setTimeout(()=>cass.classList.remove('run'),seq.length*480+250)};
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const n=b.dataset.n;tone(n,.12);buf=(buf+n).slice(-seq.length);bar.style.width=Math.min(100,buf.length/seq.length*100)+'%';if(buf===seq){bar.classList.add('ok');localStorage.setItem('bwradio','1');setTimeout(()=>location.href='/Puzzle/7f3c20/40a711.html',900)}});</script></body></html>
