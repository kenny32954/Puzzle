<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radio Test Tape</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1011;color:#a5aeab;font:12px monospace}.wrap{max-width:800px;margin:8vh auto;padding:24px}.deck{background:#171c1e;border:1px solid #353e40;padding:30px;box-shadow:0 18px 55px #0008}.head{display:flex;justify-content:space-between;border-bottom:1px solid #394244;padding-bottom:12px}.cass{height:190px;margin:34px auto;border:2px solid #465053;background:#23292b;position:relative}.r{position:absolute;top:48px;width:78px;height:78px;border:8px solid #5c676a;border-radius:50%}.r:before{content:"";position:absolute;left:50%;top:-8px;width:3px;height:78px;background:#899390;transform:translateX(-50%)}.r.a{left:22%}.r.b{right:22%}.cass.run .r{animation:r 1s linear infinite}.play{width:100%;height:48px;background:#222a2c;color:#bcc5c2;border:1px solid #465053;font:700 13px monospace;cursor:pointer}.meter{height:8px;background:#202627;border:1px solid #333b3d;margin-top:18px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#879793}.foot{margin-top:18px;color:#606b68}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><main class="wrap"><section class="deck"><div class="head"><b>RADIO CLUB TEST TAPE</b><span>RC-19</span></div><div class="cass" id="c"><i class="r a"></i><i class="r b"></i></div><button class="play" id="p">PLAY</button><div class="meter"><i id="m"></i></div><div class="foot">BELLWEATHER HIGH SCHOOL · EQUIPMENT ROOM</div></section></main><script>
const data=[47,80,117,122,122,108,101,47,57,49,98,100,51,48,47,51,101,55,98,49,50,46,116,120,116],p=document.getElementById('p'),c=document.getElementById('c'),m=document.getElementById('m');let ctx,busy=false;
function play(){if(busy)return;busy=true;ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const bits=[];for(const b of [85,85,85,85,...data]){bits.push(0);for(let i=0;i<8;i++)bits.push((b>>i)&1);bits.push(1)}const u=.055,g=ctx.createGain();g.gain.value=.08;g.connect(ctx.destination);let t=ctx.currentTime+.08;bits.forEach((bit,i)=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=bit?2200:1200;o.connect(g);o.start(t+i*u);o.stop(t+(i+1)*u)});c.classList.add('run');const dur=bits.length*u*1000;m.animate([{width:'0%'},{width:'100%'}],{duration:dur,fill:'forwards',easing:'linear'});setTimeout(()=>{c.classList.remove('run');busy=false;m.style.width='0'},dur+200)}
p.onclick=play;
</script></body></html>
