<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interview Splice</title><style>
*{box-sizing:border-box}body{margin:0;background:#111313;color:#9da5a2;font:12px monospace}.top{height:46px;background:#171b1b;border-bottom:1px solid #313737;display:flex;justify-content:space-between;align-items:center;padding:0 20px}.wrap{max-width:920px;margin:6vh auto;padding:22px}.bench{background:#1b2020;border:1px solid #3a4141;padding:28px;box-shadow:0 18px 55px #0009}.head{display:flex;justify-content:space-between;border-bottom:1px solid #3c4444;padding-bottom:12px}.track{margin:34px 0;display:grid;gap:12px}.seg{height:58px;border:1px solid #465050;background:#242b2b;display:flex;align-items:center;justify-content:space-between;padding:0 18px;cursor:grab;user-select:none}.seg:active{cursor:grabbing}.seg b{font-size:18px;color:#b8c0bd}.seg i{display:block;height:6px;background:repeating-linear-gradient(90deg,#899591 0 8px,transparent 8px 14px);flex:1;margin:0 22px}.bar{height:7px;background:#212727;border:1px solid #333a3a}.bar.ok{background:#899892;box-shadow:0 0 18px #89989277}.foot{margin-top:16px;color:#626c69}</style></head><body><header class="top"><span>BELLWEATHER ORAL HISTORY ROOM</span><span>SPLICE TABLE 02</span></header><main class="wrap"><section class="bench"><div class="head"><b>INTERVIEW REEL</b><span>MV-12</span></div><div class="track" id="t"><div class="seg" draggable="true" data-v="0"><b>03:19</b><i></i><span>A</span></div><div class="seg" draggable="true" data-v="1"><b>08:20</b><i></i><span>B</span></div><div class="seg" draggable="true" data-v="2"><b>09:05</b><i></i><span>C</span></div><div class="seg" draggable="true" data-v="3"><b>10:45</b><i></i><span>D</span></div><div class="seg" draggable="true" data-v="4"><b>14-C</b><i></i><span>E</span></div><div class="seg" draggable="true" data-v="5"><b>0619</b><i></i><span>F</span></div></div><div class="bar" id="b"></div><div class="foot">BELLWEATHER HISTORICAL SOCIETY · AUDIO ROOM</div></section></main><script>
