<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clock Service</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1010;color:#9aa3a0;font:12px monospace}.top{height:46px;background:#131717;border-bottom:1px solid #2e3535;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.wrap{max-width:940px;margin:7vh auto;padding:22px}.panel{background:#181d1d;border:1px solid #363e3e;padding:30px;box-shadow:0 18px 55px #0009}.head{display:flex;justify-content:space-between;border-bottom:1px solid #394141;padding-bottom:12px}.clocks{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin:42px 0}.c{aspect-ratio:1;border:2px solid #4a5552;border-radius:50%;position:relative;background:#202626;cursor:pointer}.c:before{content:"";position:absolute;inset:10%;border:1px solid #3b4542;border-radius:50%}.h,.m{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;background:#b0bbb7;border-radius:2px}.h{width:4px;height:24%;}.m{width:2px;height:35%;}.c span{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);color:#66716d}.bar{height:7px;background:#202727;border:1px solid #333b3b}.bar.ok{background:#899892;box-shadow:0 0 18px #89989277}.foot{margin-top:16px;color:#616b68}@media(max-width:700px){.clocks{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><span>BELLWEATHER CLOCK SERVICE</span><span>BENCH 04</span></header><main class="wrap"><section class="panel"><div class="head"><b>NORTH ANNEX CLOCK CIRCUIT</b><span>31-D</span></div><div class="clocks" id="cs"><button class="c" data-i="0"><i class="h"></i><i class="m"></i><span>A</span></button><button class="c" data-i="1"><i class="h"></i><i class="m"></i><span>B</span></button><button class="c" data-i="2"><i class="h"></i><i class="m"></i><span>C</span></button><button class="c" data-i="3"><i class="h"></i><i class="m"></i><span>D</span></button></div><div class="bar" id="b"></div><div class="foot">BELLWEATHER MUNICIPAL SERVICE · 1994</div></section></main><script>
const C=[...document.querySelectorAll('.c')],b=document.getElementById('b'),Q=[122,5,32,47,47,57,48,122,108,54,103,97,54,51,122,99,100,51,50,48,49,122,97,101,49,100,103,103,123,61,33,56,57],T=(0x57^0x5d);let v=[3,7,1,9];
function draw(){C.forEach((c,i)=>{c.querySelector('.h').style.transform=`translateX(-50%) rotate(${v[i]*30}deg)`;c.querySelector('.m').style.transform=`translateX(-50%) rotate(${((v[i]*5)%60)*6}deg)`});if(v.every(x=>x===T)){b.classList.add('ok');localStorage.setItem('bwclocks','1');setTimeout(()=>location.href=Q.map(n=>String.fromCharCode(n^85)).join(''),850)}}
C.forEach((c,i)=>c.onclick=()=>{v[i]=(v[i]+1)%12;draw()});draw();
</script></body></html>
