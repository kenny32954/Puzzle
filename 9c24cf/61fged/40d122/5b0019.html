<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clock Room</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a0d0d;color:#909a96;font:12px monospace}.top{height:46px;background:#111515;border-bottom:1px solid #293130;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.wrap{max-width:1000px;margin:7vh auto;padding:22px}.panel{background:#151a1a;border:1px solid #343c3b;padding:30px;box-shadow:0 18px 55px #0009}.clocks{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.c{aspect-ratio:1;border:2px solid #46514e;border-radius:50%;position:relative;background:#202625}.h,.m{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;background:#b3bdb9}.h{width:4px;height:24%}.m{width:2px;height:36%}.c span{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);color:#64706c}.c.hot{cursor:pointer}.c.hot.flash{box-shadow:0 0 26px #9eafa966}.meta{margin-top:24px;color:#5d6965}</style></head><body><header class="top"><span>NORTH ANNEX CLOCK ROOM</span><span>1994</span></header><main class="wrap"><section class="panel"><div class="clocks"><button class="c " data-i="0"><i class="h"></i><i class="m"></i><span>EAST</span></button><button class="c " data-i="1"><i class="h"></i><i class="m"></i><span>WEST</span></button><button class="c hot" data-i="2"><i class="h"></i><i class="m"></i><span>LOWER</span></button><button class="c " data-i="3"><i class="h"></i><i class="m"></i><span>UPPER</span></button></div><div class="meta">17 MAR · BENCH 04</div></section></main><script>
const cs=[...document.querySelectorAll('.c')];let t=0;function set(c,h,m){c.querySelector('.h').style.transform=`translateX(-50%) rotate(${(h%12)*30+m*.5}deg)`;c.querySelector('.m').style.transform=`translateX(-50%) rotate(${m*6}deg)`}
function tick(){const d=new Date(),h=d.getHours(),m=d.getMinutes();set(cs[0],h,m);set(cs[1],h,(m+7)%60);set(cs[2],3,19);set(cs[3],9,5);cs[2].classList.toggle('flash',t%7===0);t++;setTimeout(tick,1000)}tick();
cs[2].onclick=()=>location.href='/Puzzle/9c24cf/61fged/40d122/clock319.html';
</script></body></html>
