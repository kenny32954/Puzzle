<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pendulum Test</title><style>
*{box-sizing:border-box}body{margin:0;background:#080b0b;color:#929b98;font:12px monospace;overflow:hidden}.top{height:46px;background:#111515;border-bottom:1px solid #2a3131;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.wrap{height:calc(100vh - 46px);display:grid;place-items:center}.case{width:min(86vw,560px);height:min(74vh,640px);border:1px solid #343c3b;background:#151a1a;position:relative;box-shadow:0 18px 55px #0009}.pivot{position:absolute;left:50%;top:12%;width:12px;height:12px;border-radius:50%;background:#8c9793;transform:translateX(-50%)}.arm{position:absolute;left:50%;top:13%;width:3px;height:54%;background:#77827e;transform-origin:50% 0;animation:swing 1.7s ease-in-out infinite alternate}.bob{position:absolute;left:50%;bottom:-34px;width:68px;height:68px;border-radius:50%;background:#6c745f;border:2px solid #9aa196;transform:translateX(-50%);box-shadow:inset 0 -12px 20px #383d32}.zone{position:absolute;left:50%;top:61%;width:92px;height:92px;border:1px solid #34403c;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.hit{position:absolute;inset:0;border:0;background:transparent;cursor:pointer}.pips{position:absolute;left:15%;right:15%;bottom:7%;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.pips i{height:7px;background:#1f2624;border:1px solid #303836}.pips i.on{background:#91a29c;box-shadow:0 0 12px #91a29c66}@keyframes swing{from{transform:translateX(-50%) rotate(-26deg)}to{transform:translateX(-50%) rotate(26deg)}}</style></head><body><header class="top"><span>BELLWEATHER CLOCK SERVICE</span><span>03:19</span></header><main class="wrap"><section class="case" id="c"><i class="pivot"></i><div class="arm" id="a"><i class="bob"></i></div><i class="zone"></i><button class="hit" id="h"></button><div class="pips"><i></i><i></i><i></i><i></i><i></i><i></i></div></section></main><script>
const a=document.getElementById('a'),h=document.getElementById('h'),ps=[...document.querySelectorAll('.pips i')];let n=0,done=false;
h.onclick=()=>{const m=new DOMMatrix(getComputedStyle(a).transform),ang=Math.atan2(m.b,m.a)*180/Math.PI;const ok=Math.abs(ang)<5;if(ok){if(n<6)ps[n++].classList.add('on');if(n===6&&!done){done=true;localStorage.setItem('bwpend','1');setTimeout(()=>location.href='/Puzzle/9c24cf/61fged/40d122/clock319/bell.html',900)}}else{n=0;ps.forEach(x=>x.classList.remove('on'))}};
