<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accession Desk</title><style>
*{box-sizing:border-box}body{margin:0;background:#d4cfc3;color:#2b2925;font:12px monospace}.top{height:46px;background:#4a4a42;color:#eee9dc;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.wrap{max-width:1000px;margin:5vh auto;padding:22px}.desk{background:#eee8dc;border:1px solid #aaa191;padding:28px;box-shadow:0 14px 38px #0003}.slots,.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.slots{margin-bottom:34px}.slot{height:110px;border:2px dashed #a59b8a;position:relative;background:#e3dccf}.slot:before{content:"";position:absolute;top:-2px;left:var(--n);width:26px;height:12px;background:#eee8dc;border:2px solid #a59b8a;border-bottom:0}.card{height:110px;background:#c9b895;border:1px solid #8f8167;position:relative;cursor:grab;touch-action:none;box-shadow:0 4px 10px #0002}.card:before{content:"";position:absolute;top:-1px;left:var(--n);width:26px;height:12px;background:#d4c29b;border:1px solid #8f8167;border-bottom:0}.card b{position:absolute;left:9px;bottom:8px;color:#6b5e49}.card.ok{opacity:.28;cursor:default}.bar{height:7px;background:#d1c8b8;border:1px solid #aaa191;margin-top:26px}.bar.on{background:#686657}</style></head><body><header class="top"><span>BELLWEATHER ACCESSION DESK</span><span>UNLISTED</span></header><main class="wrap"><section class="desk"><div class="slots" id="slots"></div><div class="cards" id="cards"></div><div class="bar" id="bar"></div></section></main><script>
const cuts=[8,22,39,55,69,78],ord=[3,0,5,1,4,2],slots=document.getElementById('slots'),cards=document.getElementById('cards'),bar=document.getElementById('bar');let held=null,done=0;
cuts.forEach((n,i)=>{const s=document.createElement('div');s.className='slot';s.dataset.k=i;s.style.setProperty('--n',n+'%');slots.appendChild(s)});
ord.forEach((k,i)=>{const c=document.createElement('div');c.className='card';c.dataset.k=k;c.style.setProperty('--n',cuts[k]+'%');c.innerHTML='<b>'+String.fromCharCode(65+k)+'</b>';cards.appendChild(c)});
cards.addEventListener('pointerdown',e=>{const c=e.target.closest('.card');if(!c||c.classList.contains('ok'))return;held=c;c.setPointerCapture(e.pointerId)});
cards.addEventListener('pointerup',e=>{if(!held)return;const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot');if(el&&el.dataset.k===held.dataset.k){held.classList.add('ok');el.style.background='#cfc7b8';done++;if(done===6){bar.classList.add('on');setTimeout(()=>location.href='/Puzzle/aa0619/4e91c7.html',900)}}held=null});
</script></body></html>
