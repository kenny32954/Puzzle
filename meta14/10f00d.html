<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>14-C / Null</title><style>
*{box-sizing:border-box}body{margin:0;background:#050808;color:#96a09c;font:12px monospace}.top{height:46px;background:#0f1414;border-bottom:1px solid #293130;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.wrap{max-width:720px;margin:7vh auto;padding:22px}.rack{background:#131919;border:1px solid #323a39;padding:28px;box-shadow:0 18px 55px #0009}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tile{aspect-ratio:1;background:#111716;border:1px solid #36403d;padding:0;cursor:pointer}.tile svg{width:100%;height:100%;display:block}.tile line{stroke:#61706b;stroke-width:10;stroke-linecap:round}.tile.hot line{stroke:#b2c0bb;filter:drop-shadow(0 0 5px #b2c0bb88)}.bar{height:7px;background:#1d2423;border:1px solid #303837;margin-top:24px}.bar.on{background:#91a39d;box-shadow:0 0 18px #91a39d88}.meta{margin-top:12px;color:#56615d}</style></head><body><header class="top"><span>BELLWEATHER 14-C</span><span>NULL ROUTING</span></header><main class="wrap"><section class="rack"><div class="grid" id="g"></div><div class="bar" id="bar"></div><div class="meta">10 / 10</div></section></main><script>
const N=4,types=['c','c','s','c','s','c','t','s','s','c','s','c','c','c','s','s'],rot=[2,3,0,0,0,1,2,2,1,3,0,1,2,2,3,0],g=document.getElementById('g'),bar=document.getElementById('bar');let done=false;
const base={s:[0,2],c:[0,1],t:[0,1,3]},opp=[2,3,0,1];
function con(i){return base[types[i]].map(v=>(v+rot[i])%4)}
function draw(){g.innerHTML='';for(let i=0;i<16;i++){const b=document.createElement('button');b.className='tile';const c=con(i),pts=[[50,0],[100,50],[50,100],[0,50]];b.innerHTML='<svg viewBox="0 0 100 100">'+c.map(d=>'<line x1="50" y1="50" x2="'+pts[d][0]+'" y2="'+pts[d][1]+'"/>').join('')+'</svg>';b.onclick=()=>{rot[i]=(rot[i]+1)%4;draw()};g.appendChild(b)}check()}
function check(){const start=4,q=[start],seen=new Set([start]);while(q.length){const i=q.shift(),r=Math.floor(i/N),c=i%N;for(const d of con(i)){let rr=r,cc=c;if(d===0)rr--;if(d===1)cc++;if(d===2)rr++;if(d===3)cc--;if(rr<0||rr>=N||cc<0||cc>=N)continue;const j=rr*N+cc;if(con(j).includes(opp[d])&&!seen.has(j)){seen.add(j);q.push(j)}}}const ok=seen.has(15)&&con(4).includes(3)&&con(15).includes(1);[...g.children].forEach((b,i)=>b.classList.toggle('hot',seen.has(i)));if(ok&&!done){done=true;bar.classList.add('on');localStorage.setItem('bwnull','1');setTimeout(()=>location.href='/Puzzle/meta14/zero14.html',1000)}}draw();
</script></body></html>
