<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>14-C / Phase</title><style>
*{box-sizing:border-box}body{margin:0;background:#070a0a;color:#96a09d;font:12px monospace}.top{height:46px;background:#101515;border-bottom:1px solid #2a3232;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.wrap{max-width:900px;margin:7vh auto;padding:22px}.panel{background:#131919;border:1px solid #313a3a;padding:30px;box-shadow:0 18px 55px #0009}.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.r{position:relative;aspect-ratio:1;border-radius:50%;border:1px solid #47534f;background:radial-gradient(circle,#17201e 0 22%,#0c1110 23% 100%)}.r input{position:absolute;left:10%;right:10%;bottom:10%;width:80%;appearance:none;height:4px;background:#28312f}.r input::-webkit-slider-thumb{appearance:none;width:14px;height:24px;background:#9daba6}.tick{position:absolute;width:4px;height:13px;background:#71807b;left:50%;top:7%;transform-origin:2px 43%;transform:rotate(var(--a))}.dot{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:#53605c;transform:translate(-50%,-50%)}.r.ok{box-shadow:0 0 24px #8ba09855}.r.ok .dot{background:#a8b6b1;box-shadow:0 0 16px #a8b6b188}.bar{height:7px;background:#1d2423;border:1px solid #303938;margin-top:28px}.bar.on{background:#8fa19b;box-shadow:0 0 20px #8fa19b88}.meta{margin-top:14px;color:#53605c}</style></head><body><header class="top"><span>BELLWEATHER 14-C</span><span>PHASE ARRAY</span></header><main class="wrap"><section class="panel"><div class="rings" id="rings"></div><div class="bar" id="bar"></div><div class="meta">14-C / 0619</div></section></main><script>
const t=[6,1,9,4],r=document.getElementById('rings'),bar=document.getElementById('bar');let done=false;
t.forEach((v,i)=>{const q=document.createElement('div');q.className='r';q.innerHTML='<i class="tick" style="--a:'+(v*32-144)+'deg"></i><i class="dot"></i><input type="range" min="0" max="9" value="'+((v+3)%10)+'">';r.appendChild(q)});
function chk(){let n=0;[...r.children].forEach((q,i)=>{const ok=+q.querySelector('input').value===t[i];q.classList.toggle('ok',ok);n+=ok});if(n===4&&!done){done=true;bar.classList.add('on');setTimeout(()=>location.href='/Puzzle/meta14/0c0c0c.html',1000)}}r.addEventListener('input',chk);chk();
</script></body></html>
