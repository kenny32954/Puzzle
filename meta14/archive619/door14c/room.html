<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room 14-C</title><style>
*{box-sizing:border-box}body{margin:0;background:#060808;color:#8f9995;font:12px monospace;overflow:hidden}.top{height:46px;background:#0f1414;border-bottom:1px solid #293130;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.room{height:calc(100vh - 46px);position:relative;background:radial-gradient(circle at 50% 44%,#111716,#050707 70%)}.wall{position:absolute;left:12%;right:12%;top:10%;bottom:12%;border:1px solid #29312f}.chair{position:absolute;width:58px;height:55px;border:3px solid #64706c;border-top:0}.chair:before{content:"";position:absolute;left:6px;right:6px;top:-37px;height:31px;border:3px solid #64706c}.chair:after{content:"";position:absolute;left:-5px;right:-5px;bottom:-35px;height:35px;border-left:3px solid #64706c;border-right:3px solid #64706c}.target{left:63%;top:58%;opacity:.18;transform:translate(-50%,-50%)}.drag{left:37%;top:58%;transform:translate(-50%,-50%);cursor:grab;touch-action:none}.drag:active{cursor:grabbing}.lamp{position:absolute;left:50%;top:8%;width:10px;height:10px;border-radius:50%;background:#29312f;transform:translateX(-50%)}.lamp.on{background:#a2b0ab;box-shadow:0 0 24px #a2b0ab88}.bar{position:absolute;left:25%;right:25%;bottom:6%;height:7px;background:#1d2423;border:1px solid #303837}.bar.on{background:#8fa19b;box-shadow:0 0 18px #8fa19b77}</style></head><body><header class="top"><span>BELLWEATHER</span><span>ROOM 14-C</span></header><main class="room" id="rm"><div class="wall"></div><i class="lamp" id="l"></i><div class="chair target" id="t"></div><div class="chair drag" id="d"></div><div class="bar" id="b"></div></main><script>
const rm=document.getElementById('rm'),d=document.getElementById('d'),t=document.getElementById('t'),l=document.getElementById('l'),b=document.getElementById('b');let p=null,x=37,y=58,hold=null,done=false;
function set(){d.style.left=x+'%';d.style.top=y+'%';const ok=Math.abs(x-63)<1.2&&Math.abs(y-58)<1.2;l.classList.toggle('on',ok);b.classList.toggle('on',ok);clearTimeout(hold);if(ok&&!done)hold=setTimeout(()=>{done=true;setTimeout(()=>location.href='/Puzzle/meta14/archive619/door14c/room/echo.html',650)},1800)}
d.addEventListener('pointerdown',e=>{p=[e.clientX,e.clientY,x,y];d.setPointerCapture(e.pointerId)});
d.addEventListener('pointermove',e=>{if(!p)return;const r=rm.getBoundingClientRect();x=Math.max(8,Math.min(92,p[2]+(e.clientX-p[0])/r.width*100));y=Math.max(12,Math.min(88,p[3]+(e.clientY-p[1])/r.height*100));set()});
d.addEventListener('pointerup',()=>p=null);set();
</script></body></html>
