<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Echo Test</title><style>
*{box-sizing:border-box}body{margin:0;background:#060808;color:#909a96;font:12px monospace}.top{height:46px;background:#101414;border-bottom:1px solid #29302f;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.wrap{max-width:720px;margin:10vh auto;padding:22px}.panel{background:#131818;border:1px solid #303837;padding:34px;box-shadow:0 18px 55px #0009;text-align:center}.well{position:relative;width:320px;height:320px;margin:20px auto}.ring{position:absolute;left:50%;top:50%;border:1px solid #53605c;border-radius:50%;transform:translate(-50%,-50%);opacity:.25}.r1{width:90px;height:90px}.r2{width:160px;height:160px}.r3{width:235px;height:235px}.r4{width:310px;height:310px}.bell{position:absolute;left:50%;top:50%;width:74px;height:58px;transform:translate(-50%,-50%);border:0;border-radius:50% 50% 18% 18%;background:#74623f;box-shadow:inset 0 -12px 20px #3b3020;cursor:pointer}.well.pulse .r1{animation:p .75s}.well.pulse .r2{animation:p .95s}.well.pulse .r3{animation:p 1.15s}.well.pulse .r4{animation:p 1.35s}.bar{height:7px;background:#1e2423;border:1px solid #303736}.bar.on{background:#8fa19b;box-shadow:0 0 18px #8fa19b77}@keyframes p{0%{opacity:.7;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}</style></head><body><header class="top"><span>BELLWEATHER</span><span>ECHO 14-C</span></header><main class="wrap"><section class="panel"><div class="well" id="w"><i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i><i class="ring r4"></i><button class="bell" id="b"></button></div><div class="bar" id="bar"></div></section></main><script>
const pat=[420,780,420,420,1050,620],w=document.getElementById('w'),b=document.getElementById('b'),bar=document.getElementById('bar');let live=false,taps=[],last=0,ctx;
function tone(){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=520;g.gain.value=.08;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.45);o.stop(ctx.currentTime+.5);w.classList.remove('pulse');void w.offsetWidth;w.classList.add('pulse')}
function demo(){live=false;taps=[];let t=500;tone();pat.forEach((d,i)=>{t+=d;setTimeout(tone,t)});setTimeout(()=>{live=true;last=0;taps=[]},t+650)}
b.onclick=()=>{tone();if(!live)return;const now=performance.now();if(last){taps.push(now-last)}last=now;if(taps.length===pat.length){const ok=taps.every((v,i)=>Math.abs(v-pat[i])<180);live=false;if(ok){bar.classList.add('on');setTimeout(()=>location.href='/Puzzle/meta14/echo0619.html',900)}else setTimeout(demo,700)}};setTimeout(demo,900);
</script></body></html>
