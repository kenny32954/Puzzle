<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freight Lift</title><style>
*{box-sizing:border-box}body{margin:0;background:#090c0c;color:#929b98;font:12px monospace}.top{height:46px;background:#111515;border-bottom:1px solid #29302f;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.wrap{max-width:640px;margin:8vh auto;padding:22px}.cab{background:#151a1a;border:1px solid #343b3a;padding:28px;box-shadow:0 18px 55px #0009}.display{height:120px;background:#050707;border:1px solid #252c2b;display:grid;place-items:center;font-size:44px;color:#82908b}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px}.b{aspect-ratio:1;border-radius:50%;border:1px solid #48514e;background:#202625;color:#7f8985;font:700 18px monospace;cursor:pointer}.b.on{background:#9aa9a4;color:#101413}.bar{height:7px;background:#1e2423;border:1px solid #303736;margin-top:22px}.bar.on{background:#8da099;box-shadow:0 0 18px #8da09988}</style></head><body><header class="top"><span>NORTH ANNEX</span><span>FREIGHT LIFT</span></header><main class="wrap"><section class="cab"><div class="display" id="d">--</div><div class="buttons"><button class="b" data-i="0">B</button><button class="b" data-i="1">1</button><button class="b" data-i="2">2</button><button class="b" data-i="3">3</button><button class="b" data-i="4">4</button><button class="b" data-i="5">5</button><button class="b" data-i="6">6</button><button class="b" data-i="7">C</button></div><div class="bar" id="bar"></div></section></main><script>
const seq=[6,0,3,1,4,7],bs=[...document.querySelectorAll('.b')],d=document.getElementById('d'),bar=document.getElementById('bar');let p=0;bs.forEach((b,i)=>b.onclick=()=>{b.classList.add('on');setTimeout(()=>b.classList.remove('on'),120);d.textContent=b.textContent;if(i===seq[p]){p++;if(p===seq.length){bar.classList.add('on');setTimeout(()=>location.href='/Puzzle/meta14/lift031/door.html',900)}}else p=i===seq[0]?1:0});
</script></body></html>
