<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sublevel 0 / Image</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b0b;color:#969f9c;font:12px monospace}.top{height:46px;background:#101414;border-bottom:1px solid #29302f;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.wrap{max-width:760px;margin:7vh auto;padding:22px}.panel{background:#151a1a;border:1px solid #343c3b;padding:24px;box-shadow:0 18px 55px #0009}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:#050707;padding:3px}.tile{aspect-ratio:1;border:0;background:#0a0d0d;padding:0;cursor:pointer;overflow:hidden}.tile.sel{outline:3px solid #9cadA7;z-index:2}.tile svg{width:100%;height:100%;display:block;filter:grayscale(1) contrast(1.08)}.bar{height:7px;background:#1e2423;border:1px solid #303837;margin-top:18px}.bar.on{background:#8fa19b;box-shadow:0 0 18px #8fa19b77}</style></head><body><header class="top"><span>SUBLEVEL 0</span><span>IMAGE</span></header><main class="wrap"><section class="panel"><div class="grid" id="g"></div><div class="bar" id="bar"></div></section></main><script>
const g=document.getElementById('g'),bar=document.getElementById('bar'),pieces=[5,1,14,3,0,9,6,11,4,13,2,15,8,10,7,12];let sel=-1,done=false;
const scene=`<rect width="400" height="400" fill="#d4cec1"/><path d="M30 340H370M70 340V70H330V340M115 340V120H285V340" stroke="#4a463f" stroke-width="8" fill="none"/><rect x="178" y="268" width="44" height="42" fill="#5e574d"/><path d="M178 268l22-30 22 30" stroke="#5e574d" stroke-width="6" fill="none"/><rect x="274" y="116" width="34" height="108" fill="#292621"/><circle cx="86" cy="92" r="14" fill="#756d61"/><path d="M38 183h324M38 214h324" stroke="#777063" stroke-width="3" opacity=".45"/>`;
function tileSvg(piece){const r=Math.floor(piece/4),c=piece%4;return '<svg viewBox="'+(c*100)+' '+(r*100)+' 100 100" preserveAspectRatio="xMidYMid slice">'+scene+'</svg>'}
function draw(){g.innerHTML='';pieces.forEach((p,i)=>{const b=document.createElement('button');b.className='tile'+(i===sel?' sel':'');b.innerHTML=tileSvg(p);b.onclick=()=>pick(i);g.appendChild(b)});if(pieces.every((p,i)=>p===i)&&!done){done=true;bar.classList.add('on');localStorage.setItem('bwimage0','1');setTimeout(()=>location.href='/Puzzle/meta14/zero14/image/restored.html',900)}}
function pick(i){if(sel<0)sel=i;else if(sel===i)sel=-1;else{[pieces[sel],pieces[i]]=[pieces[i],pieces[sel]];sel=-1}draw()}draw();
</script></body></html>
